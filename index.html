<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme before first paint, or the light ground flashes on a
      // dark-mode load. Saved choice wins; otherwise follow the OS.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('pv_theme') } catch (e) { /* private mode */ }
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.setAttribute('data-theme', 'dark')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Places Visited</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❦</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
